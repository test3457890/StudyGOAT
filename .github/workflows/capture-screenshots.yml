name: Capture new study screens
on:
  push:
    branches: [feature/retention-wellness-guide-2026]
    paths:
      - 'StudyGOAT.html'
      - 'courses/**'
      - 'tools/capture-study-screenshots.cjs'
      - '.github/workflows/capture-screenshots.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npx playwright install chromium
      - run: node tools/capture-study-screenshots.cjs
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Capture new study mode screenshots"
            git push
          fi
